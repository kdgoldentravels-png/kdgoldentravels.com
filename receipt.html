<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receipt - KD GOLDEN TRAVELS</title><style>body{font-family:Arial;background:#eef3f8;padding:20px}.box{max-width:650px;margin:auto;background:#fff;padding:25px;border-radius:16px}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}.total{font-size:21px;font-weight:900}.btn{padding:11px 17px;border:0;border-radius:8px;margin:7px;cursor:pointer;background:#f5b400}@media print{button{display:none}}</style></head><body><div class="box"><h1>🧾 KD GOLDEN TRAVELS</h1><p>Your Journey, Our Responsibility</p><div id="r"></div><button class="btn" onclick="print()">🖨️ Print / Save PDF</button><button class="btn" onclick="wa()">💬 WhatsApp</button></div><script>let p=new URLSearchParams(location.search),g=k=>p.get(k)||"";r.innerHTML=`<div class="row"><span>Booking ID</span><b>${g("id")}</b></div><div class="row"><span>Name</span><b>${g("name")}</b></div><div class="row"><span>Mobile</span><b>${g("mobile")}</b></div><div class="row"><span>From</span><b>${g("from")}</b></div><div class="row"><span>To</span><b>${g("to")}</b></div><div class="row"><span>Date</span><b>${g("date")}</b></div><div class="row"><span>Trip</span><b>${g("trip")}</b></div><div class="row"><span>Route</span><b>${g("route")}</b></div><div class="row"><span>Distance</span><b>${g("distance")} KM ${g("trip")==="Both Side"?"(Total "+g("totalkm")+" KM)":""}</b></div><div class="row"><span>Base Fare</span><b>${g("fare")==="0"?"Contact & Confirm":"₹"+Number(g("fare")).toLocaleString("en-IN")}</b></div><div class="row"><span>Toll</span><b>₹${Number(g("toll")||0).toLocaleString("en-IN")}</b></div><div class="row"><span>Parking</span><b>₹${Number(g("parking")||0).toLocaleString("en-IN")}</b></div><div class="row"><span>Food</span><b>₹${Number(g("food")||0).toLocaleString("en-IN")}</b></div><div class="row"><span>Night</span><b>₹${Number(g("night")||0).toLocaleString("en-IN")}</b></div><div class="row total"><span>Total</span><b>${g("fare")==="0"?"Contact & Confirm":"₹"+Number(g("total")||0).toLocaleString("en-IN")}</b></div>`;function wa(){open("https://wa.me/917222826299?text="+encodeURIComponent("KD GOLDEN TRAVELS Booking\nID: "+g("id")+"\nName: "+g("name")+"\nFrom: "+g("from")+"\nTo: "+g("to")+"\nDate: "+g("date")+"\nTotal: "+(g("fare")==="0"?"Contact & Confirm":"₹"+g("total"))),"_blank")}</script></body></html>
