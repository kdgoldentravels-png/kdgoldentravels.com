<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KD GOLDEN TRAVELS - Booking Receipt</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef3f8;
  color:#172033;
}

.receipt{
  max-width:700px;
  margin:30px auto;
  background:#fff;
  padding:25px;
  border-radius:18px;
  box-shadow:0 8px 30px #0002;
}

.head{
  text-align:center;
  border-bottom:3px solid #f5bd32;
  padding-bottom:18px;
}

.logo{
  font-size:27px;
  font-weight:900;
}

.logo b{
  color:#d99d00;
}

.sub{
  color:#667085;
  margin-top:6px;
}

.booking-id{
  margin:20px 0;
  padding:12px;
  background:#fff7dc;
  border:1px dashed #d8a400;
  border-radius:10px;
  text-align:center;
  font-weight:bold;
}

.row{
  display:grid;
  grid-template-columns:180px 1fr;
  border-bottom:1px solid #e5e7eb;
  padding:12px 0;
}

.label{
  font-weight:bold;
  color:#475467;
}

.value{
  font-weight:600;
}

.status{
  display:inline-block;
  padding:7px 14px;
  border-radius:20px;
  background:#fff3cd;
  color:#7a5900;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:25px;
}

button{
  flex:1;
  padding:13px;
  border:0;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
}

.print{
  background:#f5bd32;
}

.wa{
  background:#25d366;
  color:#fff;
}

.footer{
  text-align:center;
  margin-top:25px;
  padding-top:18px;
  border-top:1px solid #ddd;
  color:#667085;
}

@media(max-width:600px){
  .receipt{
    margin:10px;
    padding:18px;
  }

  .row{
    grid-template-columns:1fr;
    gap:5px;
  }

  .buttons{
    flex-direction:column;
  }
}

@media print{
  body{
    background:#fff;
  }

  .receipt{
    margin:0;
    box-shadow:none;
    max-width:none;
  }

  .buttons{
    display:none;
  }
}
</style>
</head>

<body>

<div class="receipt">

  <div class="head">
    <div class="logo">
      KD <b>GOLDEN</b> TRAVELS
    </div>
    <div class="sub">
      Your Journey, Our Responsibility
    </div>
  </div>

  <div class="booking-id">
    Booking ID: <span id="id">---</span>
  </div>

  <div class="row">
    <div class="label">Customer Name</div>
    <div class="value" id="name">---</div>
  </div>

  <div class="row">
    <div class="label">Mobile</div>
    <div class="value" id="mobile">---</div>
  </div>

  <div class="row">
    <div class="label">Service</div>
    <div class="value" id="service">---</div>
  </div>

  <div class="row">
    <div class="label">From</div>
    <div class="value" id="from">---</div>
  </div>

  <div class="row">
    <div class="label">To</div>
    <div class="value" id="to">---</div>
  </div>

  <div class="row">
    <div class="label">Travel Date</div>
    <div class="value" id="date">---</div>
  </div>

  <div class="row">
    <div class="label">Booking Status</div>
    <div class="value">
      <span class="status">New</span>
    </div>
  </div>

  <div class="footer">
    <b>KD GOLDEN TRAVELS</b><br>
    📞 7222826299
  </div>

  <div class="buttons">
    <button class="print" onclick="window.print()">
      🖨️ Print / Save PDF
    </button>

    <button class="wa" onclick="sendWhatsApp()">
      💬 WhatsApp
    </button>
  </div>

</div>

<script>

const p = new URLSearchParams(location.search);

const get = key => p.get(key) || "---";

document.getElementById("id").textContent = get("id");
document.getElementById("name").textContent = get("name");
document.getElementById("mobile").textContent = get("mobile");
document.getElementById("service").textContent = get("service");
document.getElementById("from").textContent = get("from");
document.getElementById("to").textContent = get("to");
document.getElementById("date").textContent = get("date");

function sendWhatsApp(){

  const text =
`KD GOLDEN TRAVELS BOOKING RECEIPT

Booking ID: ${get("id")}
Name: ${get("name")}
Mobile: ${get("mobile")}
Service: ${get("service")}
From: ${get("from")}
To: ${get("to")}
Travel Date: ${get("date")}

KD GOLDEN TRAVELS
7222826299`;

  window.open(
    "https://wa.me/917222826299?text=" +
    encodeURIComponent(text),
    "_blank"
  );
}

</script>

</body>
</html>
