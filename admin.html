<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>body{font-family:Arial;background:#eef3f8;padding:20px}.box{max-width:1100px;margin:auto}.card{background:#fff;padding:18px;border-radius:14px;margin-bottom:12px;box-shadow:0 4px 15px #0001}input,button{padding:11px;margin:4px;border-radius:8px;border:1px solid #ccd5e2}button{cursor:pointer;font-weight:800}</style></head><body><div class="box"><div id="login" class="card"><h2>🔐 Admin Login</h2><input id="u" placeholder="Username"><input id="pw" type="password" placeholder="Password"><button onclick="loginNow()">Login</button><p id="m"></p></div><div id="app" style="display:none"><h2>📋 Online Bookings</h2><button onclick="load()">🔄 Refresh</button><div id="list">Loading...</div></div></div><script>const API_URL="https://script.google.com/macros/s/AKfycbzW8Ns6d74iNImmvpd66hMntXbbd1sY8Rr-LH4zzPYiqaUXnXGK8KxgxnxnWud_n-L0/exec";function loginNow(){if(u.value==="admin"&&pw.value==="12345"){login.style.display="none";app.style.display="block";load()}else m.textContent="❌ गलत Login"}async function load(){let x=await fetch(API_URL+"?action=list",{cache:"no-store"}).then(r=>r.json());list.innerHTML=(x.bookings||[]).reverse().map(b=>`<div class="card"><b>${b.id}</b> — ${b.name} — ${b.mobile}<br>🚗 ${b.from} → ${b.to}<br>📅 ${b.date} | ${b.tripType} | ${b.distance||0} KM<br>💰 Base ₹${b.baseFare||0} + Toll ₹${b.toll||0} + Parking ₹${b.parking||0} + Food ₹${b.food||0} + Night ₹${b.night||0}<br><b>Total: ₹${b.total||0}</b> | Status: ${b.status||"New"}</div>`).join("")||"No bookings"}</script></body></html>
