<!doctype html>
<html lang="hi">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>KD Golden Travels Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef3f8;
  color:#172033;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:16px;
}

.box{
  background:#fff;
  padding:20px;
  border-radius:14px;
  box-shadow:0 5px 20px #0001;
  margin-bottom:18px;
}

.login{
  max-width:400px;
  margin:10vh auto;
}

input,
select,
button{
  width:100%;
  padding:13px;
  margin:6px 0;
  border:1px solid #d7deea;
  border-radius:8px;
  box-sizing:border-box;
  font-size:15px;
}

button{
  background:#f5bd32;
  border:0;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:18px;
}

.stat{
  background:#fff;
  padding:18px;
  border-radius:12px;
  box-shadow:0 5px 20px #0001;
}

.stat b{
  font-size:24px;
}

.row{
  border-top:1px solid #ddd;
  padding:16px 0;
}

.booking-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}

.booking-id{
  font-size:13px;
  color:#666;
}

.status{
  max-width:180px;
  font-weight:bold;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.actions a,
.actions button{
  width:auto;
  display:inline-block;
  padding:10px 14px;
  text-decoration:none;
  border-radius:8px;
}

.receipt{
  background:#e9eefc;
  color:#172033;
}

.whatsapp{
  background:#25d366;
  color:#fff;
}

.delete{
  background:#e53935;
  color:#fff;
}

.message{
  background:#f7f8fa;
  padding:10px;
  border-radius:8px;
  margin-top:8px;
}

.loading{
  text-align:center;
  padding:25px;
}

.success{
  color:green;
  font-weight:bold;
}

.error{
  color:red;
  font-weight:bold;
}

@media(max-width:700px){

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .booking-top{
    display:block;
  }

  .status{
    max-width:100%;
  }

}

@media(max-width:450px){

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .wrap{
    padding:10px;
  }

}

</style>
</head>


<body>

<div class="wrap">


<!-- LOGIN -->

<div class="box login" id="loginBox">

<h2>🔐 Admin Login</h2>

<input
id="user"
placeholder="Username"
autocomplete="username">

<input
id="pass"
type="password"
placeholder="Password"
autocomplete="current-password">

<button onclick="login()">
Login
</button>

<p id="msg"></p>

</div>


<!-- PANEL -->

<div id="panel" hidden>


<div class="box">

<h2>
KD GOLDEN TRAVELS — Admin
</h2>

<button onclick="logout()">
Logout
</button>

</div>


<!-- STATS -->

<div class="stats">

<div class="stat">
Total
<br>
<b id="total">0</b>
</div>

<div class="stat">
New
<br>
<b id="newc">0</b>
</div>

<div class="stat">
Confirmed
<br>
<b id="conf">0</b>
</div>

<div class="stat">
Completed
<br>
<b id="done">0</b>
</div>

</div>


<!-- BOOKINGS -->

<div class="box">

<h3>
📋 Online Bookings
</h3>

<input
id="search"
placeholder="Search customer / mobile / service"
oninput="render()">

<div id="list">

<div class="loading">
Bookings load हो रही हैं...
</div>

</div>

</div>


</div>

</div>


<script>

const USER = "admin";
const PASS = "12345";


const API_URL =
"https://script.google.com/macros/s/AKfycbzW8Ns6d74iNImmvpd66hMntXbbd1sY8Rr-LH4zzPYiqaUXnXGK8KxgxnxnWud_n-L0/exec";


let allBookings = [];


// =========================
// LOGIN
// =========================

function login(){

  const u =
    document.getElementById("user").value.trim();

  const p =
    document.getElementById("pass").value;

  if(u === USER && p === PASS){

    sessionStorage.setItem("kdAdmin","1");

    show();

  }else{

    document.getElementById("msg").textContent =
      "Wrong username or password.";

  }

}


// =========================
// LOGOUT
// =========================

function logout(){

  sessionStorage.removeItem("kdAdmin");

  location.reload();

}


// =========================
// SHOW PANEL
// =========================

function show(){

  document.getElementById("loginBox").hidden = true;

  document.getElementById("panel").hidden = false;

  render();

}


// =========================
// ESCAPE HTML
// =========================

function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[m];

    });

}


// =========================
// LOAD BOOKINGS
// =========================

async function render(){

  const list =
    document.getElementById("list");

  list.innerHTML =
    '<div class="loading">⏳ Bookings load हो रही हैं...</div>';

  try{

    const response =
      await fetch(
        API_URL + "?action=list&t=" + Date.now(),
        {
          cache:"no-store"
        }
      );

    const data =
      await response.json();

    allBookings =
      Array.isArray(data)
        ? data
        : (data.bookings || []);

    drawBookings();

    updateStats();

  }catch(error){

    console.error(error);

    list.innerHTML =
      '<div class="error">❌ Database connection check करें।</div>';

  }

}


// =========================
// DRAW BOOKINGS
// =========================

function drawBookings(){

  const list =
    document.getElementById("list");

  const q =
    (
      document.getElementById("search").value || ""
    ).toLowerCase();


  const filtered =
    allBookings.filter(function(b){

      return (

        String(b.name || "")
          .toLowerCase()
          .includes(q)

        ||

        String(b.mobile || "")
          .toLowerCase()
          .includes(q)

        ||

        String(b.service || "")
          .toLowerCase()
          .includes(q)

        ||

        String(b.id || "")
          .toLowerCase()
          .includes(q)

      );

    });


  if(!filtered.length){

    list.innerHTML =
      "<p>No bookings found.</p>";

    return;

  }


  list.innerHTML =
    filtered.map(function(b){

      const status =
        b.status || "New";


      const receipt =
        "receipt.html" +
        "?id=" + encodeURIComponent(b.id || "") +
        "&name=" + encodeURIComponent(b.name || "") +
        "&mobile=" + encodeURIComponent(b.mobile || "") +
        "&from=" + encodeURIComponent(b.from || "") +
        "&to=" + encodeURIComponent(b.to || "") +
        "&date=" + encodeURIComponent(b.date || "") +
        "&service=" + encodeURIComponent(b.service || "");


      return `

      <div class="row">

        <div class="booking-top">

          <div>

            <b>
              ${esc(b.name)}
            </b>

            • ${esc(b.mobile)}

            <div class="booking-id">
              🆔 ${esc(b.id)}
            </div>

          </div>


          <select
            class="status"
            onchange="changeStatus('${esc(b.id)}',this.value)">

            <option value="New"
              ${status==="New" ? "selected" : ""}>
              🆕 New
            </option>

            <option value="Confirmed"
              ${status==="Confirmed" ? "selected" : ""}>
              ✅ Confirmed
            </option>

            <option value="Completed"
              ${status==="Completed" ? "selected" : ""}>
              ✔️ Completed
            </option>

            <option value="Cancelled"
              ${status==="Cancelled" ? "selected" : ""}>
              ❌ Cancelled
            </option>

          </select>

        </div>


        <div style="margin-top:8px">

          <b>
            ${esc(b.service)}
          </b>

          |

          ${esc(b.date)}

          |

          ${esc(b.from)}
          →
          ${esc(b.to)}

        </div>


        ${
          b.message
          ?
          `<div class="message">
             ${esc(b.message)}
           </div>`
          :
          ""
        }


        <div class="actions">

          <a
            class="receipt"
            href="${receipt}"
            target="_blank">
            🧾 Receipt
          </a>


          <a
            class="whatsapp"
            href="https://wa.me/91${encodeURIComponent(b.mobile || "")}"
            target="_blank">
            💬 WhatsApp
          </a>


          <button
            class="delete"
            onclick="deleteBooking('${esc(b.id)}')">
            🗑️ Delete
          </button>

        </div>


      </div>

      `;

    }).join("");

}


// =========================
// CHANGE STATUS
// =========================

async function changeStatus(id,status){

  if(!id) return;


  try{

    const url =
      API_URL +
      "?action=updateStatus" +
      "&id=" + encodeURIComponent(id) +
      "&status=" + encodeURIComponent(status) +
      "&t=" + Date.now();


    const response =
      await fetch(
        url,
        {
          cache:"no-store"
        }
      );


    const result =
      await response.json();


    if(!result.success){

      throw new Error(
        result.message || "Status update failed"
      );

    }


    const booking =
      allBookings.find(
        x => String(x.id) === String(id)
      );


    if(booking){

      booking.status = status;

    }


    drawBookings();

    updateStats();


  }catch(error){

    alert(
      "Status update नहीं हुआ:\n" +
      error.message
    );

    render();

  }

}


// =========================
// DELETE
// =========================

async function deleteBooking(id){

  if(!id) return;


  if(
    !confirm(
      "क्या आप यह booking delete करना चाहते हैं?"
    )
  ){

    return;

  }


  try{

    const url =
      API_URL +
      "?action=delete" +
      "&id=" + encodeURIComponent(id) +
      "&t=" + Date.now();


    const response =
      await fetch(
        url,
        {
          cache:"no-store"
        }
      );


    const result =
      await response.json();


    if(!result.success){

      throw new Error(
        result.message || "Delete failed"
      );

    }


    allBookings =
      allBookings.filter(
        x => String(x.id) !== String(id)
      );


    drawBookings();

    updateStats();


  }catch(error){

    alert(
      "Booking delete नहीं हुई:\n" +
      error.message
    );

  }

}


// =========================
// STATS
// =========================

function updateStats(){

  const a = allBookings;


  document.getElementById("total")
    .textContent = a.length;


  document.getElementById("newc")
    .textContent =
      a.filter(
        b => (b.status || "New") === "New"
      ).length;


  document.getElementById("conf")
    .textContent =
      a.filter(
        b => b.status === "Confirmed"
      ).length;


  document.getElementById("done")
    .textContent =
      a.filter(
        b => b.status === "Completed"
      ).length;

}


// =========================
// AUTO LOGIN
// =========================

document.addEventListener(
  "DOMContentLoaded",
  function(){

    if(
      sessionStorage.getItem("kdAdmin") === "1"
    ){

      show();

    }

  }
);

</script>

</body>
</html>
