<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KD GOLDEN TRAVELS - Admin</title><style>body{font-family:Arial;background:#eef3f8;margin:0;padding:18px;color:#12203a}.box{max-width:1150px;margin:auto}.card{background:#fff;padding:17px;border-radius:14px;margin-bottom:12px;box-shadow:0 4px 16px #0001}input,select,button{padding:10px;border:1px solid #ccd5e2;border-radius:8px;margin:4px}button{cursor:pointer;font-weight:800}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.search{width:100%;padding:12px}.booking{border:1px solid #e0e6ee;border-radius:12px;padding:13px;margin:10px 0}.status{font-weight:900}.actions a,.actions button{display:inline-block;text-decoration:none}.new{background:#fff3cd}.confirmed{background:#dff6e6}.completed{background:#e5e7eb}.cancelled{background:#ffe1e1}.muted{color:#68768a;font-size:13px}</style></head><body><div class="box"><div id="login" class="card"><h2>🔐 Admin Login</h2><input id="u" placeholder="Username"><input id="pw" type="password" placeholder="Password"><button onclick="loginNow()">Login</button><p id="m"></p></div><div id="app" style="display:none"><div class="card head"><h2>📋 Online Bookings</h2><button onclick="load()">🔄 Refresh</button></div><div class="card"><input id="search" class="search" placeholder="🔎 Name / Mobile / Booking ID / From / To search" oninput="render()"><select id="filter" onchange="render()"><option value="All">All Status</option><option>New</option><option>Confirmed</option><option>Completed</option><option>Cancelled</option></select><span id="count" class="muted"></span></div><div id="list">Loading...</div></div></div><script>
const API_URL="https://script.google.com/macros/s/AKfycbzW8Ns6d74iNImmvpd66hMntXbbd1sY8Rr-LH4zzPYiqaUXnXGK8KxgxnxnWud_n-L0/exec";let bookings=[];function loginNow(){if(document.getElementById("u").value==="admin"&&document.getElementById("pw").value==="12345"){login.style.display="none";app.style.display="block";load()}else m.textContent="❌ गलत Login"}async function load(){list.innerHTML="⏳ Loading...";try{const x=await fetch(API_URL+"?action=list",{cache:"no-store"}).then(r=>r.json());if(!x.success)throw Error(x.message||"Failed");bookings=(x.bookings||[]).reverse();render()}catch(e){list.innerHTML="❌ "+e.message}}function esc(s){return String(s??"").replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function render(){const q=(search.value||"").toLowerCase(),f=filter.value;const a=bookings.filter(b=>(f==="All"||b.status===f)&&JSON.stringify(b).toLowerCase().includes(q));count.textContent=a.length+" booking(s)";list.innerHTML=a.map(b=>{const st=b.status||"New",cls=st.toLowerCase();const receipt="receipt.html?"+new URLSearchParams({id:b.id,name:b.name,mobile:b.mobile,from:b.from,to:b.to,date:b.date,trip:b.tripType,route:b.route||"",distance:b.distance||"",totalkm:b.totalDistance||"",time:b.travelTimeMin||"",fare:b.baseFare||0,toll:b.toll||0,parking:b.parking||0,food:b.food||0,night:b.night||0,total:b.total||0,status:st});return `<div class="booking ${cls}"><b>${esc(b.id)}</b> — <b>${esc(b.name)}</b> — ${esc(b.mobile)}<br>🚗 ${esc(b.from)} → ${esc(b.to)}<br>📅 ${esc(b.date)} | ${esc(b.tripType)} | Route ${esc(b.route||"")} | ${esc(b.distance||0)} KM | ⏱ ${Math.floor(Number(b.travelTimeMin||0)/60)}h ${Number(b.travelTimeMin||0)%60}m<br>💰 Base ₹${Number(b.baseFare||0).toLocaleString('en-IN')} + Toll ₹${Number(b.toll||0).toLocaleString('en-IN')} + Parking ₹${Number(b.parking||0).toLocaleString('en-IN')} + Food ₹${Number(b.food||0).toLocaleString('en-IN')} + Night ₹${Number(b.night||0).toLocaleString('en-IN')}<br><b>Total: ${Number(b.total||0)?'₹'+Number(b.total||0).toLocaleString('en-IN'):'Contact & Confirm'}</b> <span class="status">| Status: ${esc(st)}</span><div class="actions"><select onchange="changeStatus('${encodeURIComponent(b.id)}',this.value)"><option ${st==='New'?'selected':''}>New</option><option ${st==='Confirmed'?'selected':''}>Confirmed</option><option ${st==='Completed'?'selected':''}>Completed</option><option ${st==='Cancelled'?'selected':''}>Cancelled</option></select><a href="${receipt}" target="_blank"><button>🧾 Receipt</button></a><a href="https://wa.me/${'91'+String(b.mobile||'').replace(/\D/g,'')}?text=${encodeURIComponent('KD GOLDEN TRAVELS Booking '+b.id+'\n'+b.from+' → '+b.to+'\nDate: '+b.date+'\nStatus: '+st)}" target="_blank"><button>💬 WhatsApp</button></a></div></div>`}).join("")||"No bookings"}async function changeStatus(id,value){try{const x=await fetch(API_URL+"?action=status&id="+id+"&value="+encodeURIComponent(value)).then(r=>r.json());if(!x.success)throw Error(x.message||"Failed");const b=bookings.find(x=>String(x.id)===decodeURIComponent(id));if(b)b.status=value;render()}catch(e){alert("Status update failed: "+e.message)}}
</script></body></html>
