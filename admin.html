<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KD Golden Travels Admin</title>
<style>body{margin:0;font-family:Arial;background:#eef3f8;color:#172033}.wrap{max-width:1050px;margin:auto;padding:20px}.box{background:#fff;padding:22px;border-radius:14px;box-shadow:0 5px 20px #0001;margin-bottom:18px}.login{max-width:380px;margin:10vh auto}input,select,button{width:100%;padding:12px;margin:6px 0;border:1px solid #d7deea;border-radius:8px;box-sizing:border-box}button{background:#f5bd32;border:0;font-weight:bold}.row{border-top:1px solid #ddd;padding:14px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;padding:18px;border-radius:12px}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}}</style></head>
<body><div class="wrap">
<div class="box login" id="loginBox"><h2>🔐 Admin Login</h2><input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="msg"></p></div>
<div id="panel" hidden><div class="box"><h2>KD GOLDEN TRAVELS — Admin</h2><button onclick="logout()">Logout</button></div>
<div class="stats"><div class="stat">Total<br><b id="total">0</b></div><div class="stat">New<br><b id="newc">0</b></div><div class="stat">Confirmed<br><b id="conf">0</b></div><div class="stat">Completed<br><b id="done">0</b></div></div>
<div class="box"><h3>Online Bookings</h3><input id="search" placeholder="Search" oninput="render()"><div id="list">API URL set करने के बाद bookings यहाँ आएंगी।</div></div></div></div>
<script>
const USER="admin",PASS="12345"; const API_URL="https://script.google.com/macros/s/AKfycbzW8Ns6d74iNImmvpd66hMntXbbd1sY8Rr-LH4zzPYiqaUXnXGK8KxgxnxnWud_n-L0/exec";
function login(){if(user.value===USER&&pass.value===PASS){sessionStorage.kdAdmin="1";show()}else msg.textContent="Wrong username or password."}
function logout(){sessionStorage.removeItem("kdAdmin");location.reload()}
function show(){loginBox.hidden=true;panel.hidden=false;render()} if(sessionStorage.kdAdmin)show();
async function render(){if(!API_URL.startsWith("http"))return;try{const r=await fetch(API_URL+"?action=list");const a=await r.json();let q=(search.value||"").toLowerCase();let x=a.filter(b=>(b.name+" "+b.mobile+" "+b.service).toLowerCase().includes(q));list.innerHTML=x.map(b=>`<div class="row"><b>${b.name}</b> • ${b.mobile}<br>${b.service} | ${b.date} | ${b.from} → ${b.to}<br>${b.message}<br><a href="receipt.html?id=${encodeURIComponent(b.id)}&name=${encodeURIComponent(b.name)}&mobile=${encodeURIComponent(b.mobile)}&from=${encodeURIComponent(b.from)}&to=${encodeURIComponent(b.to)}&date=${encodeURIComponent(b.date)}&service=${encodeURIComponent(b.service)}" target="_blank">🧾 Receipt</a><br>Status: ${b.status||"New"}</div>`).join("")||"No bookings";total.textContent=a.length;newc.textContent=a.filter(b=>b.status=="New").length;conf.textContent=a.filter(b=>b.status=="Confirmed").length;done.textContent=a.filter(b=>b.status=="Completed").length}catch(e){list.textContent="Database connection check करें।"}}
</script></body></html>
